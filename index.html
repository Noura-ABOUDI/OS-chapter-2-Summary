<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux · Chapter 2 / Chapitre 2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#14213d;--mute:#4a5878;--line:#c9d4ea;--blue:#1d4ed8;--sun:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233b;--ink:#eaf0ff;--mute:#a9b7d6;--line:#2c3c5e;--blue:#7ea4ff;--sun:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233b;--ink:#eaf0ff;--mute:#a9b7d6;--line:#2c3c5e;--blue:#7ea4ff;--sun:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Nunito,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:40px 20px;text-align:center}
.tux{font-size:min(30vw,130px);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18))}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-size:clamp(32px,7vw,52px);line-height:1.1;margin:8px 0}
.sub{color:var(--mute);margin:0 0 28px}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
a.lang{display:block;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:26px 18px;transition:transform .2s,border-color .2s}
a.lang:hover,a.lang:focus-visible{transform:translateY(-4px);border-color:var(--sun);outline:none}
a.lang:focus-visible{box-shadow:0 0 0 4px var(--sun)}
a.lang .flag{font-size:54px;display:block}
a.lang b{display:block;font-family:"Baloo 2",sans-serif;font-size:28px;color:var(--blue)}
a.lang span.d{color:var(--mute);font-size:16px}
a.lang.rec{border-color:var(--sun)}
.note{margin-top:26px;color:var(--mute);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="tux" aria-hidden="true">🐧</div>
  <h1>Linux, explained simply</h1>
  <p class="sub">Linux expliqué simplement<br>Operating System 1 · Chapter 2 / Chapitre 2 BC G1</p>
  <div class="choose">
    <a class="lang" id="en" href="Linux_explained_eng.html" target="_blank" rel="noopener">
      <span class="flag" aria-hidden="true">EN</span><b>English</b><span class="d">Start the animated lesson</span>
    </a>
    <a class="lang" id="fr" href="Linux_explained_fr.html" target="_blank" rel="noopener">
      <span class="flag" aria-hidden="true">🇫🇷</span><b>Français</b><span class="d">Commencer la leçon animée</span>
    </a>
  </div>
  <p class="note">Choose your language / Choisissez votre langue</p>
</main>
<script>
try{if((navigator.language||'').toLowerCase().indexOf('fr')===0){document.getElementById('fr').classList.add('rec')}else{document.getElementById('en').classList.add('rec')}}catch(e){}
</script>
</body>
</html>
